# Each service imports shared policies but owns its database and listening ports.
spring:
  config:
    # Import shared policies explicitly; service and environment files provide their own overrides.
    import: classpath:platform-defaults.yml
  application:
    # Identify this independently running service in logs and infrastructure configuration.
    name: appraisal-service
  profiles:
    # Use dev only when no active profile is supplied at runtime.
    default: dev
    group:
      # Activating demo also activates dev; appraisal-service adds demo-specific cache overrides.
      demo: [dev]
server:
  # Application HTTP port; SERVER_PORT overrides the service-specific local default.
  port: ${SERVER_PORT:8082}
management:
  server:
    # Expose health and metrics on a separate port from business APIs.
    port: ${MANAGEMENT_PORT:9082}
app:
  property-client:
    # Create the shared HTTP property client only in services that need remote property lookup.
    enabled: true
    # Call property-service through its runtime URL; deployed profiles require an explicit
    # environment-specific address.
    base-url: ${PROPERTY_SERVICE_URL:http://localhost:8081}
    # Bound TCP connection establishment for property lookups.
    connect-timeout: 1s
    # Bound network response waiting for property lookups.
    response-timeout: 2s
    # Bound each HTTP exchange attempt; retry backoff and multiple attempts can extend the overall
    # caller duration.
    total-timeout: 3s
rental:
  # Use synthetic mock data by default; HTTP mode requires a configured provider endpoint.
  provider-mode: ${RENTAL_PROVIDER_MODE:mock}
  http:
    # External rental API root used only when HTTP provider mode is selected.
    base-url: ${RENTAL_PROVIDER_URL:}
    # Bound the rental HTTP connection pool separately from the JDBC pool.
    max-connections: 16
    # Limit waiting for a free rental HTTP connection.
    acquire-timeout: 250ms
    # Bound TCP connection establishment to the rental provider.
    connect-timeout: 1s
    # Bound network response waiting from the rental provider.
    response-timeout: 2s
    # Bound one rental HTTP exchange attempt; retries have their own attempt budget.
    total-timeout: 3s
  cache:
    # Reserve refresh ownership temporarily without holding a database connection during the
    # provider call.
    refresh-lease: 15s
    # Bound how long another request waits for an existing refresh before receiving a retryable
    # response.
    concurrent-wait: 2s
    ttl:
      # Reuse rental estimates for this duration before another provider refresh is required.
      RENTAL_ESTIMATE: 30m
      # Neighborhood aggregates can use a different freshness window from individual estimates.
      NEIGHBORHOOD_STATISTICS: 6h
      # Control how long comparable-property results remain reusable.
      RENTAL_COMPARABLES: 1h
